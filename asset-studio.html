    .btn-gold {

    .btn-purple {

    // ── State Management ──
    const STORAGE_KEY = 'waterdrop_master_theme_manifest';

    function loadChoices() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      const def = {};
      CATEGORIES.forEach(c => { def[c.id] = 1; });
      return def;
    }

    function saveChoices() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(choices));
      } catch (e) {}
      renderStepper();
    }

        const isDone = choices[cat.id] != null;
        item.className = `step-item ${isCur ? 'active' : ''} ${isDone ? 'completed' : ''}`;
        item.innerHTML = `<span>${idx + 1}.</span> <span>${cat.icon} ${cat.name.split(' ')[0]}</span>`;
        item.onclick = () => {
          currentStepIndex = idx;
          renderCurrentScreen();
        };
        nav.appendChild(item);

      const revItem = document.createElement('div');
      revItem.className = `step-item ${currentStepIndex === 25 ? 'active' : ''}`;

    function prevStep() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        renderCurrentScreen();
      }
    }

    function nextStep() {
      if (currentStepIndex < 25) {
        currentStepIndex++;
        renderCurrentScreen();
      } else {
        submitManifest();
      }
    }

    function goToReviewStep() {
      currentStepIndex = 25;
      renderCurrentScreen();
    }

    function applyPreset(presetKey) {
      if (presetKey === 'cyber') {
        CATEGORIES.forEach(c => { choices[c.id] = 2; });
        choices.hero_skins = 3; choices.map_giza = 3; choices.observation_vistas = 5;
      } else if (presetKey === 'solstice') {
        CATEGORIES.forEach(c => { choices[c.id] = 5; });
        choices.hero_skins = 4; choices.weapons = 4; choices.observation_vistas = 3;
      } else if (presetKey === 'blood') {
        CATEGORIES.forEach(c => { choices[c.id] = 4; });
        choices.hero_skins = 5; choices.weapons = 5; choices.observation_vistas = 4;
      }
      saveChoices();
      renderCurrentScreen();
    }

    // ── Save & Submit To Agent API Endpoint ──
    async function submitManifest() {
      const manifest = {
        title: "Waterdrop Survivor — Master Theme & Design Manifest (25 Systems)",
        timestamp: new Date().toISOString(),
        totalCategories: CATEGORIES.length,
        selectedStyles: {}
      };

      CATEGORIES.forEach(cat => {
        const optId = choices[cat.id] || 1;
        const optObj = cat.options.find(o => o.id === optId) || cat.options[0];
        manifest.selectedStyles[cat.id] = {
          category: cat.name,
          chosenOptionId: optId,
          chosenStyleName: optObj.name,
          colorAccent: optObj.color,
          description: optObj.desc
        };
      });

      // Send to local Python Server endpoint if running
      try {
        const res = await fetch('/api/save-theme', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(manifest)
        });
        if (res.ok) {
          alert('🎉 ALL 25 CHOICES SAVED TO WORKSPACE (selected_master_theme.json)!\nAntigravity has received your choices and can now build the entire game to this exact visual standard!');
          return;
        }
      } catch (e) {}

      // Fallback: Download file directly
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "selected_master_theme.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      alert('🎉 THEME MANIFEST DOWNLOADED AS selected_master_theme.json!\nSave it into your project folder so Antigravity can read your exact choices!');
    }

    function shadeColor(color, percent) {
      let R = parseInt(color.substring(1,3),16);
      let G = parseInt(color.substring(3,5),16);
      let B = parseInt(color.substring(5,7),16);
      R = parseInt(R * (100 + percent) / 100);
      G = parseInt(G * (100 + percent) / 100);
      B = parseInt(B * (100 + percent) / 100);
      R = (R<255)?R:255;  G = (G<255)?G:255;  B = (B<255)?B:255;
      R = Math.max(0, R); G = Math.max(0, G); B = Math.max(0, B);
      const RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
      const GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
      const BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
      return "#"+RR+GG+BB;
    }

    // ── Thumb Canvas Visuals ──
    function drawThumb(optId, catId, opt) {
      const cvs = document.getElementById(`thumb_cvs_${optId}`);
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      const w = cvs.width, h = cvs.height;
      ctx.clearRect(0, 0, w, h);

      const bgGrad = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, w/2);
      bgGrad.addColorStop(0, '#160d2e');
      bgGrad.addColorStop(1, '#05020c');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      const aura = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, 40);
      aura.addColorStop(0, opt.color + '66');
      aura.addColorStop(1, 'transparent');
      ctx.fillStyle = aura;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(w/2, h/2);
      const col = opt.color;

      if (catId === 'hero_skins') {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.bezierCurveTo(18, 0, 18, 22, 0, 22);
        ctx.bezierCurveTo(-18, 22, -18, 0, 0, -22);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-4, -4, 3.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (catId === 'xp_drops' || catId === 'gems') {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(16, 0);
        ctx.lineTo(0, 20);
        ctx.lineTo(-16, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      } else if (catId === 'chests') {
        ctx.fillStyle = '#1c102a';
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;
        ctx.fillRect(-22, -12, 44, 26);
        ctx.strokeRect(-22, -12, 44, 26);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(0, 1, 4, 0, Math.PI * 2);
        ctx.fill();
      } else if (catId === 'combat_hud') {
        ctx.fillStyle = '#0b0617';
        ctx.fillRect(-45, -12, 90, 10);
        ctx.fillStyle = col;
        ctx.fillRect(-43, -10, 65, 6);
      } else {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.restore();
    }

    // ── Live Interactive Motion & Animation Clip Engine ──
    let activeAction = 'idle';
    let actionTimer = 0;
    let animFrame = 0;
    let particles = [];
    let damageNumbers = [];

    function triggerAction(actionName) {
      activeAction = actionName;
      actionTimer = 0;

      // Spawn burst particles depending on action
      const w = 320, h = 140;
      const hx = w * 0.45, hy = h * 0.60;

      if (actionName === 'slash') {
        for (let i = 0; i < 16; i++) {
          particles.push({
            x: hx + 20, y: hy, vx: (Math.random() - 0.2) * 5, vy: (Math.random() - 0.5) * 4,
            life: 1.0, color: '#5fd6ff', size: 3 + Math.random() * 3
          });
        }
        damageNumbers.push({ x: hx + 40, y: hy - 20, text: 'CRIT 1,480!', color: '#ffd166', life: 1.0 });
      } else if (actionName === 'finisher') {
        for (let i = 0; i < 28; i++) {
          particles.push({
            x: hx + 30, y: hy + 10, vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.7) * 6,
            life: 1.2, color: '#ffd166', size: 4 + Math.random() * 4
          });
        }
        damageNumbers.push({ x: hx + 50, y: hy - 35, text: '★ 8,920 OBLIVION ★', color: '#ff3355', life: 1.2 });
      } else if (actionName === 'scythe') {
        for (let i = 0; i < 24; i++) {
          const angle = Math.random() * Math.PI * 2;
          particles.push({
            x: hx + Math.cos(angle) * 30, y: hy + Math.sin(angle) * 20,
            vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 3,
            life: 1.0, color: '#b362ff', size: 3 + Math.random() * 3
          });
        }
      } else if (actionName === 'chest') {
        for (let i = 0; i < 30; i++) {
          particles.push({
            x: hx + 30, y: hy - 10, vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 6,
            life: 1.5, color: i % 2 === 0 ? '#ffd700' : '#4dffd4', size: 3 + Math.random() * 4
          });
        }
        damageNumbers.push({ x: hx + 30, y: hy - 40, text: '+500 GEMS & LEGENDARY RELIC!', color: '#ffd700', life: 1.5 });
      } else if (actionName === 'slots') {
        damageNumbers.push({ x: hx + 10, y: hy - 30, text: '🎰 7 - 7 - 7 JACKPOT! 🎰', color: '#39ff14', life: 1.5 });
      }

      renderCurrentScreen();
    }

    function drawLiveSandbox() {
      const cvs = document.getElementById('liveCanvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      const w = cvs.width, h = cvs.height;
      ctx.clearRect(0, 0, w, h);

      animFrame += 0.04;
      actionTimer += 0.04;

      // Draw Chosen Environment Ground
      const mapChoice = choices.map_giza || 1;
      const mapCol = CATEGORIES.find(c => c.id === 'map_giza')?.options.find(o => o.id === mapChoice)?.color || '#ffd166';
      
      const groundGrad = ctx.createLinearGradient(0, 0, 0, h);
      groundGrad.addColorStop(0, '#090414');
      groundGrad.addColorStop(0.7, '#13082a');
      groundGrad.addColorStop(1, '#05020a');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, 0, w, h);

      // Grid Lines
      ctx.strokeStyle = mapCol + '22';
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, h * 0.65);
        ctx.lineTo(x - 20, h);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(0, h * 0.68);
      ctx.lineTo(w, h * 0.68);
      ctx.stroke();

      // Hero Position & Animation State
      const heroChoice = choices.hero_skins || 1;
      const heroCol = CATEGORIES.find(c => c.id === 'hero_skins')?.options.find(o => o.id === heroChoice)?.color || '#5fd6ff';
      const hx = w * 0.40;
      let hy = h * 0.58;

      if (activeAction === 'run') {
        hy += Math.sin(animFrame * 12) * 5;
      } else if (activeAction === 'idle') {
        hy += Math.sin(animFrame * 3) * 2;
      } else if (activeAction === 'rage') {
        hy += (Math.random() - 0.5) * 3;
      }

      // Rage Aura
      if (activeAction === 'rage' || choices.hero_skins === 5) {
        const aura = ctx.createRadialGradient(hx, hy, 5, hx, hy, 35);
        aura.addColorStop(0, '#ff335588');
        aura.addColorStop(1, 'transparent');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(hx, hy, 35, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Hero Droplet Sprite
      ctx.save();
      ctx.translate(hx, hy);
      ctx.fillStyle = heroCol;
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.bezierCurveTo(15, 0, 15, 18, 0, 18);
      ctx.bezierCurveTo(-15, 18, -15, 0, 0, -18);
      ctx.fill();
      // Specular Gleam
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-4, -4, 3, 0, Math.PI * 2);
      ctx.fill();
      // Eyes
      ctx.fillStyle = '#06030c';
      ctx.beginPath();
      ctx.arc(-4, 3, 2, 0, Math.PI * 2);
      ctx.arc(4, 3, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw Weapons & Attack Action Effects
      const wpnChoice = choices.weapons || 1;
      const wpnCol = CATEGORIES.find(c => c.id === 'weapons')?.options.find(o => o.id === wpnChoice)?.color || '#ffd166';

      if (activeAction === 'slash') {
        ctx.strokeStyle = wpnCol;
        ctx.lineWidth = 4.0;
        ctx.beginPath();
        const slashAngle = Math.sin(actionTimer * 10) * 1.2;
        ctx.arc(hx + 18, hy - 4, 26, slashAngle - 0.8, slashAngle + 0.8);
        ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else if (activeAction === 'finisher') {
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 6.0;
        ctx.beginPath();
        ctx.arc(hx + 28, hy + 5, 34, -Math.PI * 0.6, Math.PI * 0.6);
        ctx.stroke();
        ctx.strokeStyle = '#ff3355';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      } else if (activeAction === 'scythe') {
        ctx.strokeStyle = '#b362ff';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.arc(hx, hy, 38, animFrame * 15, animFrame * 15 + Math.PI * 1.4);
        ctx.stroke();
      } else if (activeAction === 'bow') {
        // Arrow beam projectile
        const arrX = (hx + 20 + (actionTimer * 200) % 180);
        ctx.fillStyle = '#ffd166';
        ctx.fillRect(arrX, hy - 2, 20, 4);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(arrX + 16, hy - 3, 6, 6);
      } else if (activeAction === 'chest') {
        // Draw open chest box
        ctx.fillStyle = '#221238';
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.fillRect(hx + 30, hy - 5, 36, 24);
        ctx.strokeRect(hx + 30, hy - 5, 36, 24);
      }

      // Draw Orbiting Particles & Droplets
      const xpChoice = choices.xp_drops || 1;
      const xpCol = CATEGORIES.find(c => c.id === 'xp_drops')?.options.find(o => o.id === xpChoice)?.color || '#4dc4ff';
      for (let i = 0; i < 4; i++) {
        const xpx = w * 0.76 + Math.sin(animFrame * 2 + i * 1.5) * 18;
        const xpy = h * 0.60 + Math.cos(animFrame * 2 + i * 1.5) * 12;
        ctx.fillStyle = xpCol;
        ctx.beginPath();
        ctx.arc(xpx, xpy, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(xpx - 1, xpy - 1, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Update & Draw Action Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      // Update & Draw Floating Numbers / Banners
      for (let i = damageNumbers.length - 1; i >= 0; i--) {
        const d = damageNumbers[i];
        d.y -= 0.8;
        d.life -= 0.02;
        if (d.life <= 0) {
          damageNumbers.splice(i, 1);
          continue;
        }
        ctx.font = 'bold 13px "VT323", monospace';
        ctx.fillStyle = d.color;
        ctx.globalAlpha = d.life;
        ctx.fillText(d.text, d.x, d.y);
        ctx.globalAlpha = 1.0;
      }

      // Draw Selected UI HUD Bar
      const uiChoice = choices.combat_hud || 1;
      const uiCol = CATEGORIES.find(c => c.id === 'combat_hud')?.options.find(o => o.id === uiChoice)?.color || '#4dffd4';
      ctx.fillStyle = '#000000bb';
      ctx.fillRect(8, 8, 110, 14);
      ctx.strokeStyle = uiCol;
      ctx.lineWidth = 1;
      ctx.strokeRect(8, 8, 110, 14);
      ctx.fillStyle = uiCol;
      ctx.fillRect(10, 10, 75, 10);
      ctx.fillStyle = '#ffffff';
      ctx.font = '10px monospace';
      ctx.fillText('HP 75/100', 16, 18);
    }

    setInterval(drawLiveSandbox, 33);

    // ── Init ──
    renderCurrentScreen();
  </script>
</body>
</html>
